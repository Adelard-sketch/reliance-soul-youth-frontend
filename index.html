<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/src/assets/reliance_logo.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Title + Metadata (defaults - will be overridden by react-helmet-async) -->
    <title>Reliance Soul International Youth Foundation</title>
    <meta name="description" content="Empowering young people through arts, culture, and creative expression." />
    <meta name="author" content="ADELARD BORAUZIMA" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Additional meta tags for better discoverability -->
    <meta name="keywords" content="youth empowerment Uganda, refugee support, arts education, music workshops, dance classes, creative programs, studio booking, NGO Uganda, youth foundation, cultural expression" />
    <meta name="geo.region" content="UG" />
    <meta name="geo.placename" content="Uganda" />

    <!-- Open Graph defaults -->
    <meta property="og:site_name" content="Reliance Soul International Youth Foundation" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:type" content="website" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Schema.org structured data for AI and search engines -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "NGO",
      "name": "Reliance Soul International Youth Foundation",
      "alternateName": "Reliance Soul Youth Foundation",
      "description": "Empowering young people through arts, culture, and creative expression. We provide music workshops, dance classes, design programs, and studio booking services for youth development.",
      "url": "https://www.reliancesoulfdn.org",
      "logo": "https://www.reliancesoulfdn.org/src/assets/reliance_logo.jpg",
      "foundingDate": "2020",
      "founder": {
        "@type": "Person",
        "name": "Adelard Borauzima"
      },
      "address": {
        "@type": "PostalAddress",
        "addressCountry": "UG"
      },
      "areaServed": "Uganda",
      "knowsAbout": ["Youth Empowerment", "Arts Education", "Music Workshops", "Dance Classes", "Creative Design", "Cultural Expression", "Community Development"],
      "sameAs": [
        "https://www.facebook.com/profile.php?id=100093395088925",
        "https://www.instagram.com/reliancesoulyouth/",
        "https://www.youtube.com/@RelianceSoulYouthInitiative"
      ],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "General Inquiries",
        "email": "info@reliancesoulfdn.org",
        "telephone": "+256777969984"
      },
      "offers": [
        {
          "@type": "Service",
          "name": "Music Workshops",
          "description": "Sessions focused on performance, song composition, instruments, and production basics"
        },
        {
          "@type": "Service",
          "name": "Dance Classes",
          "description": "Movement, choreography, and confidence-building sessions for all levels"
        },
        {
          "@type": "Service",
          "name": "Design & Crafts Programs",
          "description": "Practical design sessions covering visuals, crafts, and digital creativity"
        },
        {
          "@type": "Service",
          "name": "Studio Booking",
          "description": "Professional studio space available for creative projects and recordings"
        }
      ]
    }
    </script>

    <!-- Fonts (optional: artistic vibe) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;900&family=Poppins:wght@400;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
